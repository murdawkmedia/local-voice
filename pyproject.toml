[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-voice"
version = "0.1.0.dev6"
description = "Offline Linux dictation and meetings"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["PyQt6==6.11.0", "evdev==2.0.0"]

[project.scripts]
local-voice = "local_voice.cli:main"

[tool.setuptools.packages.find]
include = ["local_voice*"]
